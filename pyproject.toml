[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-ctl"
version = "0.2.0"
description = "按住快捷键说话 → 本地离线识别 → 匹配动作 → 执行。纯离线 Windows 语音指令。"
requires-python = ">=3.10"
dependencies = [
    "sherpa-onnx>=1.13",
    "sounddevice>=0.5",
    "pynput>=1.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
# 第 1 层语义决策（可选）。装了才能用 [decision].enabled = true。
decision = ["laya[onnx]>=0.3.27"]
pinyin = ["pypinyin>=0.53"]
dev = ["pytest>=8"]

[project.scripts]
voice-ctl = "voice_ctl.cli:main"

[tool.setuptools]
packages = ["voice_ctl", "voice_ctl.actions"]
