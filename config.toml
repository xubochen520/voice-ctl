# voice-ctl 配置
#
# 按住热键说话 → 本地离线识别 → 匹配动作 → 执行。
#
# 加一个新能力：在下面 [[action]] 段加一条即可，不用改代码。
# handler 支持：open_app / open_path / open_url / sysctl / keys / shell

[hotkey]
# pynput 语法。可改成 <ctrl>+<alt>+j、<f9>、<ctrl>+<shift>+space 等。
# 注意：纯 <ctrl>+space 在中文 Windows 上是输入法切换键，会被抢，所以默认加了 alt。
# 用法是**按住说话**：按住不放把话说完，松手才识别。
# 带修饰键的组合（默认这个）会在你按下 Ctrl/Alt 的那一刻先把麦克风打开
# （约 150ms），所以从按下到开口之间的字不会被截掉。单键热键（<f9>）没有这个
# 提前量，但你开口后进来的音频一样会被保留，不会丢字。
keys = "<ctrl>+<alt>+space"
min_duration_ms = 200      # 短于此时长视为误触
max_duration_ms = 15000    # 超时强制停止，防按键卡住

[audio]
samplerate = 16000         # SenseVoice 要求，不要改
channels = 1               # 必须单声道
# device 留空（不写这一行）用系统默认麦克风。
# 要用特定设备时，先跑 `voice-ctl devices` 查序号，再写 device = 3
# 静音判据用**峰值**而不是 RMS：安静环境下的真实说话 RMS 可能低到 0.002
# （和底噪同级），但峰值通常在 0.05 以上。用 RMS 会把小声说话静默丢掉，
# 表现为"有时候喊了没反应"，极难查。0 = 关闭该过滤。
min_peak = 0.01

[model]
dir = "models/sense-voice-int8"
# language 实测对 SenseVoice 输出无影响（zh/auto/en 结果一致），保留 auto 即可
language = "auto"
use_itn = true             # 数字/标点正常化（"九点" → "9点" 之类）
num_threads = 2
provider = "cpu"           # cpu / cuda / coreml；本机 CPU 已足够（RTF≈0.04）

[normalize]
# 同音/近音误识别替换：{"识别错的写法" = "正确写法"}
# 发现 ASR 老把某个词听错，往这里加一条即可，不用改代码。
# 例：围信 = "微信"  记时本 = "记事本"
# （内置了一批常见错法，见 voice_ctl/normalize.py 的 DEFAULT_SUBSTITUTIONS）
substitutions = {}
use_pinyin = true          # 用 pypinyin 做同音判定（装了才生效，建议装）

[match]
threshold = 80             # 别名模糊匹配阈值 0-100，越高越严格
strip_prefixes = ["请", "帮我", "帮忙", "麻烦", "给我", "我要", "我想", "我要你", "呃", "嗯"]
strip_suffixes = ["谢谢", "吧", "啊", "呀", "呢", "一下", "好么", "好吗"]

[decision]
# 第 1 层语义决策（Laya）。第 0 层别名匹配搞不定的口语化指令才走这里。
#
# 开启步骤：
#   1. .venv\Scripts\pip install "laya[onnx]"
#   2. voice-ctl fetch-decision          （下载 ONNX 权重，约 900MB）
#   3. 把下面的 enabled 改成 true
#   4. voice-ctl doctor 确认语义层显示 ✓
#
# 实测：6 选项零样本下判「有个文件要改一下」「把声音关小」这类口语全对，
# 单次推理 42-58ms，加载 10.4s（只加载一次）。但它只该兜住第 0 层漏掉的输入，
# 不该当主判据——官方 benchmark 里 20 选项意图任务是 0.451。
#
# ⚠ 这一层**需要 torch（约 500MB）**，哪怕权重是 ONNX 的：laya.onnx_agent 会
#   顶层 import laya.common，而 laya.common 第 13 行就是 import torch。
#   所以默认的精简版 exe 开不了它（报 No module named 'torch'，装 pip 包也修不了）
#   ——要用它请跑源码版，或按 VOICE_CTL_BUNDLE_DECISION=1 重新打包。
enabled = false
model = "multilingual"     # 中文务必用 multilingual；english checkpoint 中文接近随机
min_confidence = 0.6       # 低于此值不执行，只提示。实测负样本正好落在 0.589
onnx_dir = "models/laya-onnx/multilingual"

[web]
# 网页解析：说「打开百度」就开 baidu.com（站点表在 voice_ctl/web.py，约 70 个常见站）。
# 关掉就退回旧行为：只有配置里写了 target 的站才开得了。
enabled = true
# 站点表里没有的名字，退一步走搜索而不是直接失败。
# 这需要**联网**（搜索页要能上网）。彻底离线用就设 false——站点表本身不联网，
# 关了之后「打开百度」照样能用。
search_fallback = true
search_url = "https://www.baidu.com/s?wd={q}"

[feedback]
beep = true
beep_start_hz = 880
beep_end_hz = 1320
beep_ms = 70
print_result = true

[intent]
# 意图层：把一整句话读成「要做什么 + 对谁做 + 什么时候」。
#
# 它修的是别名匹配的三个实测缺陷：
#   「设置今天下午三点的日程我要玩游戏」 以前会打开 Windows 设置（别名「设置」被命中）
#   「关闭微信」                        以前会**打开**微信（动词被忽略）
#   「打开QQ」                          以前什么都匹配不上（配置里没有 [[action]]）
#
# 默认开着。真觉得它误判了，改成 false 就退回纯别名匹配，行为与 0.2.0 一致。
enabled = true

# 拿不准时（两个应用得分接近、没说上午还是下午）问一句，最多等这么久（秒）。
# 超时按"放弃"处理。
confirm_timeout = 12.0

[schedule]
# 日程 / 提醒：说「明天早上八点提醒我开会」就有一条会准时响的提醒。
#
# 纯本地：存在 data_file 里，由本程序常驻提醒，不依赖任何账号或云端日历。
# 需要导入手机/Outlook 时用 `voice-ctl schedule --export 日程.ics`。
enabled = true

# 留空 = 可写数据目录下的 schedule.json。相对路径按本配置文件所在目录解析。
data_file = ""

# 默认提前几分钟提醒。
remind_before = 0

[llm]
# 可选的小模型层：用**本地跑着的大模型**兜住前几层读不懂的长尾。
#
#   「有个文件要改一下」  想开记事本，但一个名字都没提
#   「把声音关小」        想调音量
#
# 它排在意图层、别名匹配、动态应用词典**之后**，只在前几层都没结果时才被调用。
# 模型只做一件事：在候选动作里挑一个。时间由 timeparse 解析、动作由注册表执行
# ——模型没有"执行"这个字段可以填。
#
# 两种后端：
#   local   内置 llama.cpp（默认）。自己下 llama-server + 一个小 GGUF 模型，
#           打包后的应用**不需要任何外部软件**。两步：
#               voice-ctl llm --install     下 llama.cpp 运行时（17.7MB 下载 / 39.8MB 磁盘）
#               voice-ctl llm --download    下模型（默认 0.5B，469MB）
#           llama.cpp 的 Windows 构建没有 Vulkan（只有 CPU/CUDA/OpenVINO/SYCL/ROCm），
#           所以取的是 CPU 版；它带一整套 ggml-cpu-*.dll，按 CPU 指令集自动挑一个，
#           从 Sandy Bridge 到最新的机器都能跑。
#   server  接一个已经在跑的服务（LM Studio 1234 / Ollama 11434 / llama.cpp 自己起的）。
#           endpoint 改一下就行，两家都是 OpenAI 的 /chat/completions 协议。
#
# ⚠ 实测（这台 i7-13650HX，CPU 推理，10 条用例 = 6 条真该命中 + 4 条负样本）：
#
#     模型                        加载     单次     真该命中   负样本误触发
#     qwen2.5-0.5b Q4_K_M        0.7s    90ms     0/6        0/4
#     qwen3-0.6b Q8_0            0.9s   199ms     0/6        0/4
#     qwen2.5-1.5b Q4_K_M        1.4s   110ms     6/6        0/4
#
#   0.5B/0.6B 档位**几乎只会答 null**：不误触发，但也帮不上忙。真想让它干活，
#   用 1.5B（约 1GB）：model = "qwen2.5-1.5b-instruct"。
#   已经开了 Laya 语义层（[decision]，20 选项实测 6/6）的话，这一层能补的很有限。
#
# 输出用 GBNF 语法锁死（只允许输出候选编号或 null），所以模型**结构上不可能**
# 编出一个不存在的动作——实测 20 次无关输入一次都没越界。
enabled = false
backend = "local"
endpoint = "http://127.0.0.1:1234/v1"    # backend = "server" 时用
model = "qwen2.5-0.5b-instruct"          # MODELS 里的名字，或模型目录里任意 .gguf
timeout = 4.0              # 外部服务单次请求超时（秒）
request_timeout = 30.0     # 内置 llama.cpp 单次请求超时（秒）
ctx_size = 2048            # 内置 llama.cpp 的上下文长度；抽槽位用不了这么长
threads = 0                # 0 = 自动（CPU 核数的一半）
startup_timeout = 60.0     # 等 llama-server 就绪的上限（秒）
max_candidates = 12        # 给模型看几个候选；越多它越容易乱挑

# --------------------------------------------------------------------------- #
# 意图层用的两个"万能"动作
#
# 它们没有固定目标：要开/关谁，由意图层当场从**已安装应用索引**（开始菜单）
# 解析出来。所以「打开QQ」「关闭微信」「打开Steam」不用各写一段 [[action]]。
#
# 想固定绑某个程序时，给 open.target 写 target = "..." 即可（那时它就和
# open_app 一样了）。
# --------------------------------------------------------------------------- #

[[action]]
id = "open.target"
handler = "open_target"
aliases = ["打开应用", "启动程序"]
describe = "打开任意已安装的应用（动态解析）"
target = ""

# 日程 / 提醒。要建谁、什么时候，由意图层解析后通过槽位传进来。
[[action]]
id = "schedule"
handler = "schedule"
aliases = ["日程", "提醒", "闹钟", "待办", "记一下", "提醒我"]
describe = "建一条日程/提醒，到点会响"
target = "event"          # event / reminder / alarm / timer

[[action]]
id = "sys.close_app"
handler = "close_app"
aliases = ["关闭应用", "退出程序"]
describe = "关闭一个正在运行的应用（动态解析）"
target = ""

# 兜底：要关的东西没在已安装应用里（比如「关闭记事本」而它不在开始菜单），
# 按名字去关窗口。放在 sys.close_app 之后，只有前者给不出进程名时才轮到它。
[[action]]
id = "sys.close_window"
handler = "close_app"
aliases = ["关闭窗口", "关掉窗口"]
describe = "按名字关掉窗口（兜底）"
target = ""
enabled = true

