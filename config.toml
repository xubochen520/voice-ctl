# 动作表
# --------------------------------------------------------------------------- #

[[action]]
id = "open.wechat"
handler = "open_app"
aliases = ["微信", "威信", "wechat", "聊天", "发消息"]
describe = "打开微信，用来聊天、发消息"
# 留空则自动从注册表/常见安装路径查找；找不到时用 `voice-ctl doctor` 会提示
target = ""

[[action]]
id = "open.browser"
handler = "open_url"
aliases = ["浏览器", "打开浏览器", "上网", "chrome", "谷歌浏览器"]
