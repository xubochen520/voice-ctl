# voice-ctl 配置
#
# 按住热键说话 → 本地离线识别 → 匹配动作 → 执行。
#
# 加一个新能力：在下面 [[action]] 段加一条即可，不用改代码。
# handler 支持：open_app / open_path / open_url / sysctl / keys / shell

[hotkey]
# pynput 语法。可改成 <ctrl>+<alt>+j、<f9>、<ctrl>+<shift>+space 等。
# 注意：纯 <ctrl>+space 在中文 Windows 上是输入法切换键，会被抢，所以默认加了 alt。
keys = "<ctrl>+<alt>+space"
min_duration_ms = 200      # 短于此时长视为误触
max_duration_ms = 15000    # 超时强制停止，防按键卡住

[audio]
samplerate = 16000         # SenseVoice 要求，不要改
channels = 1               # 必须单声道
# device 留空（不写这一行）用系统默认麦克风。
# 要用特定设备时，先跑 `voice-ctl devices` 查序号，再写 device = 3
# 静音判据用**峰值**而不是 RMS：安静环境下的真实说话 RMS 可能低到 0.002
# （和底噪同级），但峰值通常在 0.05 以上。用 RMS 会把小声说话静默丢掉，
# 表现为"有时候喊了没反应"，极难查。0 = 关闭该过滤。
min_peak = 0.01

[model]
dir = "models/sense-voice-int8"
# language 实测对 SenseVoice 输出无影响（zh/auto/en 结果一致），保留 auto 即可
language = "auto"
use_itn = true             # 数字/标点正常化（"九点" → "9点" 之类）
num_threads = 2
provider = "cpu"           # cpu / cuda / coreml；本机 CPU 已足够（RTF≈0.04）

[normalize]
# 同音/近音误识别替换：{"识别错的写法" = "正确写法"}
# 发现 ASR 老把某个词听错，往这里加一条即可，不用改代码。
# 例：围信 = "微信"  记时本 = "记事本"
# （内置了一批常见错法，见 voice_ctl/normalize.py 的 DEFAULT_SUBSTITUTIONS）
substitutions = {}
use_pinyin = true          # 用 pypinyin 做同音判定（装了才生效，建议装）

[match]
threshold = 80             # 别名模糊匹配阈值 0-100，越高越严格
strip_prefixes = ["请", "帮我", "帮忙", "麻烦", "给我", "我要", "我想", "我要你", "呃", "嗯"]
strip_suffixes = ["谢谢", "吧", "啊", "呀", "呢", "一下", "好么", "好吗"]

[decision]
# 第 1 层语义决策（Laya）。第 0 层别名匹配搞不定的口语化指令才走这里。
#
# 开启步骤：
#   1. .venv\Scripts\pip install "laya[onnx]"
#   2. voice-ctl fetch-decision          （下载 ONNX 权重，约 900MB）
#   3. 把下面的 enabled 改成 true
#   4. voice-ctl doctor 确认语义层显示 ✓
#
# 实测：6 选项零样本下判「有个文件要改一下」「把声音关小」这类口语全对，
# 单次推理 42-58ms，加载 10.4s（只加载一次）。但它只该兜住第 0 层漏掉的输入，
# 不该当主判据——官方 benchmark 里 20 选项意图任务是 0.451。
enabled = false
model = "multilingual"     # 中文务必用 multilingual；english checkpoint 中文接近随机
min_confidence = 0.6       # 低于此值不执行，只提示。实测负样本正好落在 0.589
onnx_dir = "models/laya-onnx/multilingual"

[feedback]
beep = true
beep_start_hz = 880
beep_end_hz = 1320
beep_ms = 70
print_result = true

